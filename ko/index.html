er3/1920/1440"],"note":"지형 데이터를 기반으로 한 추상 영상이 바닥 전체를 덮는 몰입형 프로젝션입니다."},{"id":"RES09","t":"Resonant Grid","s":"2024","e":"2024","date":"2024.10","form":"object-screen","kind":"work","tags":["interactive","physical-computing","realtime","sensors","light"],"img":"../assets/uploads/resonant-grid-1783536731047-388544.jpg","images":["../assets/uploads/resonant-grid-1783536731047-388544.jpg","https://picsum.photos/seed/resonant1/1920/1440","https://picsum.photos/seed/resonant2/1920/1440","https://picsum.photos/seed/resonant3/1920/1440"],"note":"브랜드 런칭 이벤트용 인터랙티브 미디어 설치이다. 그리드 형태의 조명과 센서 입력이 결합되어 관객의 참여에 따라 공간이 반응한다. 담당 Arduino 기반 센서·조명 제어 시스템 개발 DMX 조명 시퀀스 프로그래밍 현장 설치 및 인터랙션 테스트"},{"id":"SIL10","t":"Silent Circuit","s":"2024","e":"2024","date":"2024.04","form":"object-screen","kind":"work","tags":["interactive","physical-computing","realtime","sensors"],"img":"../assets/uploads/silent-circuit-1783536645863-267776.jpg","images":["../assets/uploads/silent-circuit-1783536645863-267776.jpg","https://picsum.photos/seed/silentci1/1920/1440","https://picsum.photos/seed/silentci2/1920/1440","https://picsum.photos/seed/silentci3/1920/1440"],"note":"전기 신호의 흐름을 빛의 회로로 시각화한 인터랙티브 설치입니다."},{"id":"SLO11","t":"Slow Circuit","s":"2024","e":"2024","date":"2024.06","form":"object-screen","kind":"work","tags":["interactive","physical-computing","realtime","sensors"],"img":"../assets/uploads/slow-circuit-1783535231223-875608.jpg","images":["../assets/uploads/slow-circuit-1783535231223-875608.jpg","https://picsum.photos/seed/slowcirc1/1920/1440","https://picsum.photos/seed/slowcirc2/1920/1440","https://picsum.photos/seed/slowcirc3/1920/1440"],"note":"느린 시간의 흐름을 회로의 속도로 시각화한 프로젝션 설치입니다."},{"id":"SOF12","t":"Soft Machine","s":"2024","e":"2024","date":"2024.03","form":"object-screen","kind":"work","tags":["physical-computing","realtime","sensors"],"img":"../assets/uploads/soft-machine-1783535930416-588092.jpg","images":["../assets/uploads/soft-machine-1783535930416-588092.jpg","https://picsum.photos/seed/softmach1/1920/1440","https://picsum.photos/seed/softmach2/1920/1440","https://picsum.photos/seed/softmach3/1920/1440"],"note":"기계와 유기체의 경계를 탐구하는 인터랙티브 전시입니다."},{"id":"SON13","t":"Sonic Veil","s":"2024","e":"2024","date":"2024.10","form":"screen","kind":"work","tags":["interactive","realtime"],"img":"../assets/uploads/sonic-veil-1783536089311-914832.jpg","images":["../assets/uploads/sonic-veil-1783536089311-914832.jpg","https://picsum.photos/seed/sonicvei1/1920/1440","https://picsum.photos/seed/sonicvei2/1920/1440","https://picsum.photos/seed/sonicvei3/1920/1440"],"note":"공간음향과 프로젝션을 결합한 설치 작업이다. 관객의 위치에 따라 소리의 밀도와 빛의 결이 달라지는 경험을 설계했다. 담당 Max/MSP 공간음향 패치 개발 TouchDesigner 비주얼 연동 설치·시연 환경 세팅"},{"id":"ECH14","t":"The Piano Room","s":"2024","e":"2024","date":"2024.07","form":"space-object","kind":"work","tags":["interactive","physical-computing","realtime","projection","sensors"],"img":"../assets/uploads/01.jpg","images":["../assets/uploads/01.jpg","../assets/uploads/02.jpg","../assets/uploads/03.jpg"],"note":"빛과 소리가 공명하는 설치 작품입니다. 관객의 움직임에 반응하여 실시간으로 변화하는 사운드스케이프와 빛의 패턴이 생성됩니다. 이 작업은 피아노라는 익숙한 악기가 놓인 방을 재해석하는 데서 출발했다. 건반을 두드리지 않아도 소리가 발생하고, 사람이 다가가는 것만으로도 공간 전체가 하나의 악기처럼 반응하기 시작한다. 관객은 연주자가 아니라 공간 그 자체를 몸으로 연주하는 존재가 된다. 공간에는 총 12개의 적외선 근접 센서와 6채널 공간음향 시스템이 설치되어 있으며, 각 센서는 Arduino 기반 마이크로컨트롤러를 통해 실시간으로 데이터를 수집한다. 수집된 거리·속도 데이터는 시리얼 통신을 거쳐 Unreal Engine으로 전달되고, 이는 다시 프로젝션 매핑된 빛의 패턴과 다채널 사운드의 볼륨·패닝 값을 동시에 제어하는 데 사용된다. 기술적으로 가장 까다로웠던 부분은 지연 시간(latency)을 최소화하는 것이었다. 관객의 움직임과 빛·소리의 반응 사이에 조금이라도 어긋남이 느껴지면, 공간이 자신에게 반응한다는 몰입감이 순식간에 깨져버린다. 이를 위해 센서 폴링 주기를 20ms 이하로 조정하고, 언리얼 엔진 내부에서는 별도의 스레드로 오디오·비주얼 파이프라인을 분리해 프레임 드랍이 발생하더라도 사운드 반응만큼은 끊기지 않도록 설계했다. 전시 기간 동안 가장 인상 깊었던 순간은 아이들이 이 공간을 대하는 방식이었다. 성인 관객들은 대체로 조심스럽게 공간의 규칙을 파악하려 하지만, 아이들은 곧바로 뛰어다니며 몸 전체로 반응을 시험한다. 그 과정에서 예상하지 못했던 소리의 조합, 빛의 겹침이 발생했고, 이는 작업이 완성된 이후에도 계속해서 변주되고 있다는 인상을 주었다. 공간음향 디자인에서는 단순히 소리가 나는 위치를 재현하는 것을 넘어, 관객의 이동 경로에 따라 잔향(reverb)의 길이와 밀도가 달라지도록 설계했다. 방의 중심에 가까워질수록 소리는 더 넓게 퍼지고 길게 울리며, 벽 쪽으로 이동할수록 소리는 좁고 건조해진다. 이는 실제 피아노가 놓인 방의 음향 특성을 참고해 디지털 환경에서 재구성한 것이다. 빛의 패턴은 크게 세 가지 상태를 오간다: 정적인 상태에서는 은은한 호흡하는 듯한 밝기 변화만이 존재하고, 한 명의 관객이 감지되면 그 사람을 중심으로 동심원 형태의 파동이 퍼져나가며, 여러 명이 동시에 감지될 경우에는 각자의 파동이 서로 간섭하며 예측 불가능한 무늬를 만들어낸다. 이 간섭 패턴은 사전에 정해진 애니메이션이 아니라 실시간 연산을 통해 매 순간 다르게 생성된다. 이 작업을 준비하며 가장 많이 고민했던 질문은 '기술이 보이지 않게 만드는 방법'이었다. 센서와 프로젝터, 스피커는 물리적으로 공간 곳곳에 존재하지만, 관객이 그 장치들의 존재를 의식하는 순간 작품이 주는 경험은 설명 가능한 메커니즘으로 축소되어 버린다. 그래서 모든 하드웨어는 벽과 천장에 최대한 은닉했고, 배선 또한 바닥 마감재 아래로 매립해 관객의 시선에서 완전히 사라지도록 했다. 결과적으로 이 작품은 하나의 완성된 결과물이라기보다, 관객이 머무는 시간 동안 계속해서 다시 쓰이는 악보에 가깝다. 같은 공간이지만 누가, 몇 명이, 어떤 속도로 움직이는가에 따라 전혀 다른 소리와 빛의 조합이 생성되며, 이는 향후 다른 공간에서의 변형 설치로도 확장할 계획이다.","vimeo":"https://vimeo.com/1208184865?fl=tl&fe=ec"},{"id":"LAY15","t":"Layered City","s":"2023","e":"2023","date":"2023.05","form":"screen","kind":"professional","tags":["interactive","realtime","projection"],"img":"../assets/uploads/layered-city-1783536481692-955235.jpg","images":["../assets/uploads/layered-city-1783536481692-955235.jpg","https://picsum.photos/seed/layeredc1/1920/1440","https://picsum.photos/seed/layeredc2/1920/1440","https://picsum.photos/seed/layeredc3/1920/1440"],"note":"도시의 시간적 층위를 인터랙티브 매핑으로 탐구하는 전시 프로젝트입니다."},{"id":"FRA16","t":"Fractal Memory","s":"2022","e":"2022","date":"2022.04","form":"screen","kind":"professional","tags":["realtime"],"img":"../assets/uploads/fractal-memory-1783536361480-700792.jpg","images":["../assets/uploads/fractal-memory-1783536361480-700792.jpg","https://picsum.photos/seed/fractalm1/1920/1440","https://picsum.photos/seed/fractalm2/1920/1440","https://picsum.photos/seed/fractalm3/1920/1440"],"note":"기억의 층위를 프랙탈 구조로 시각화한 프로젝션 설치이다. 관객의 움직임에 따라 영상 레이어가 분기·중첩되며 새로운 패턴을 만든다. 담당 TouchDesigner 프로젝션 매핑 설계 MadMapper 출력·블렌딩 구성 설치 공간 레이아웃 협의"},{"id":"GRA17","t":"Gravity Well","s":"2022","e":"2022","date":"2022.08","form":"space","kind":"professional","tags":["interactive","realtime"],"img":"../assets/uploads/gravity-well-1783536704000-468627.jpg","images":["../assets/uploads/gravity-well-1783536704000-468627.jpg","https://picsum.photos/seed/gravityw1/1920/1440","https://picsum.photos/seed/gravityw2/1920/1440","https://picsum.photos/seed/gravityw3/1920/1440"],"note":"관객의 움직임에 반응하는 인터랙티브 설치 프로젝트이다. 중력 데이터를 시각·청각 요소로 변환해 공간 전체의 몰입감을 높였다. 담당 Unreal Engine 인터랙션 환경 제작 ZigSim 센서 데이터 연동 물리 시뮬레이션·사운드 디자인 협업"},{"id":"PRI18","t":"Prism Field","s":"2021","e":"2021","date":"2021.01","form":"space","kind":"professional","tags":["interactive","realtime","light"],"img":"../assets/uploads/prism-field-1783536531816-473773.jpg","images":["../assets/uploads/prism-field-1783536531816-473773.jpg","https://picsum.photos/seed/prismfie1/1920/1440","https://picsum.photos/seed/prismfie2/1920/1440","https://picsum.photos/seed/prismfie3/1920/1440"],"note":"브랜드 전시 공간에 설치된 대형 프로젝션 미디어월 프로젝트이다. 스펙트럼 빛이 공간을 가로지르며, 관람 동선에 따라 시각적 리듬이 변화한다. 담당 TouchDesigner 영상 파이프라인 구성 DMX 조명 연동 및 시퀀스 설계 현장 프로젝션 매핑·셋업"},{"id":"DD19","t":"The Forest","s":"2021","e":"2021","date":"2021.09","form":"space-object","kind":"work","tags":["interactive","physical-computing","realtime","projection","sensors"],"img":"../assets/uploads/dd-1783536105613-917651.jpg","images":["../assets/uploads/dd-1783536105613-917651.jpg","../assets/uploads/f01.jpg","../assets/uploads/f02.jpg","../assets/uploads/f03.jpg"],"note":"잔상의 개념을 몸과 영상으로 탐구하는 라이브 퍼포먼스입니다."},{"id":"GHO20","t":"Ghost Frequency","s":"2020","e":"2020","date":"2020.01","form":"object-screen","kind":"professional","tags":["interactive","physical-computing","realtime","sensors"],"img":"../assets/uploads/ghost-frequency-1783536430417-714178.jpg","images":["../assets/uploads/ghost-frequency-1783536430417-714178.jpg","https://picsum.photos/seed/ghostfre1/1920/1440","https://picsum.photos/seed/ghostfre2/1920/1440","https://picsum.photos/seed/ghostfre3/1920/1440"],"note":"보이지 않는 주파수 대역을 빛으로 번역한 인터랙티브 설치입니다."},{"id":"COD21","t":"Code Landscape","s":"2018","e":"2018","date":"2018.04","form":"screen","kind":"work","tags":["interactive","realtime"],"img":"../assets/uploads/code-la 계는 자연스럽게 흐려지고, 경험은 하나의 기억으로 남는다.","approach":"삼도원의 작업에서 기술은 보여주기 위한 대상이 아니라 경험을 위한 재료이다. 센서는 조용히 뒤에서 작동하며, 관객이 기술보다 공간과 경험 자체에 몰입하도록 돕는다. 사람들이 잠시 걸음을 늦추고, 눈앞의 경험을 믿어보며, 일상의 행동이 작품 속 현실이 되도록 이끈다. 최근에는 익숙한 사물과 공간에 작은 변화를 더해, 사람들의 기억과 감각에 오래 머무는 따뜻한 경험을 만드는 작업을 이어가고 있다.","fields":["인터랙티브 설치","피지컬 컴퓨팅","실시간 그래픽","센서 기술"],"image":"https://picsum.photos/seed/3dowon-about/1200/800","labels":{"practice":"작업","approach":"방식"}},"cv":{"sections":[{"title":"Education","entries":[{"year":"2017–2019","description":"명지전문대학 소프트웨어콘텐츠"}]},{"title":"Experience","entries":[{"year":"2026.03–","description":"Nerdy Artist Union, 테크니컬 아티스트"},{"year":"2024.01–","description":"3Dowon, 인터랙티브 미디어 아티스트"},{"year":"2025.02–2026.01","description":"I M fine, 미디어아트 개발자"},{"year":"2022.01–2023.12","description":"d'strict, 미디어아트 개발자"}]},{"title":"Exhibitions","entries":[{"year":"2025.11","description":"단체전, \u003cem>3Dowon's workdesk\u003c/em>, Uprising Festa vol.1, SETEC, 서울"},{"year":"2025.03","description":"개인전, \u003cem>몇 동 몇 호 (Postcode)\u003c/em>, CICA Museum, 김포"}]},{"title":"Awards","entries":[{"year":"2021","description":"대상, 실감형 콘텐츠 창작자 양성사업, KOCCA"},{"year":"2019","description":"대상, VR 콘텐츠 공모, 문화체육관광부/KOCCA"},{"year":"2018","description":"대상, 성남 커넥트 게임캠프, 성남산업진흥원"},{"year":"2018","description":"특별상, 공학밴드 페스티벌, 공학교육혁신협의회"},{"year":"2018","description":"대상, MR/AR/VR 콘텐츠 개발자 프로젝트 평가, SBA/명지전문대학"},{"year":"2017","description":"대상, VR 개발 경진대회, 명지전문대학"},{"year":"2017","description":"대상, 가상현실 콘텐츠 기획 경진대회, 명지전문대학"}]},{"title":"Training","entries":[{"year":"2021.05–2021.11","description":"실감형 콘텐츠 창작자 양성사업, 한국콘텐츠진흥원 (KOCCA)"},{"year":"2019.02–2019.08","description":"3D 그래픽 아티스트 과정, 한국전파진흥협회 (RAPA)"},{"year":"2018.06–2018.12","description":"산업 맞춤형 MR/AR/VR 콘텐츠 개발 과정, 한국전파진흥협회(RAPA)"},{"year":"2018.03–2018.09","description":"가상/증강현실 콘텐츠 개발자 양성, 서울산업진흥원 (SBA)"}]}]},"copy":{"role":"Interactive installation","hint":"칸 위에 올려보세요","back":"← Index","about":"About","home":"works.html"}}</script>
