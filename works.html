ltime","sensors"],"img":"assets/uploads/data-bloom-1783536667275-733647.jpg","images":["assets/uploads/data-bloom-1783536667275-733647.jpg","https://picsum.photos/seed/databloo1/1920/1440","https://picsum.photos/seed/databloo2/1920/1440","https://picsum.photos/seed/databloo3/1920/1440"],"note":"A generative projection installation in which real-time data blooms into the form of a flower."},{"id":"DIG05","t":"Digital Tides","s":"2024","e":"2024","date":"2024.09","form":"screen","kind":"work","tags":["realtime"],"img":"assets/uploads/digital-tides-1783535990640-50128.jpg","images":["assets/uploads/digital-tides-1783535990640-50128.jpg","https://picsum.photos/seed/digitalt1/1920/1440","https://picsum.photos/seed/digitalt2/1920/1440","https://picsum.photos/seed/digitalt3/1920/1440"],"note":"A large-scale video installation visualizing the rhythm of data and tides. Real-time ocean data is transformed into the shape of waves."},{"id":"AMB06","t":"Motion Blur","s":"2024","e":"2024","date":"2024.12","form":"space","kind":"work","tags":["realtime","projection"],"img":"assets/uploads/ambient-loop-1783536021604-224324.jpg","images":["assets/uploads/ambient-loop-1783536021604-224324.jpg","assets/uploads/m03.jpg","assets/uploads/m02.jpg","assets/uploads/m04.jpg"],"note":"A media art curation project that presents environmental data in a circular structure. Multiple channels of video loop together to form a single spatial narrative. Role Built a multi-channel video scheduling system Developed a Unity-based playback and sync environment Collaborated on sound and video placement in the exhibition space"},{"id":"NEU07","t":"Neural Garden","s":"2024","e":"2024","date":"2024.10","form":"object-screen","kind":"work","tags":["physical-computing","realtime","sensors"],"img":"assets/uploads/neural-garden-1783536046701-575663.jpg","images":["assets/uploads/neural-garden-1783536046701-575663.jpg","https://picsum.photos/seed/neuralga1/1920/1440","https://picsum.photos/seed/neuralga2/1920/1440","https://picsum.photos/seed/neuralga3/1920/1440"],"note":"A generative installation in which plant forms produced by a neural network grow and dissolve within the space."},{"id":"PUL08","t":"Pulse Terrain","s":"2024","e":"2024","date":"2024.12","form":"object-screen","kind":"professional","tags":["interactive","physical-computing","realtime","sensors"],"img":"assets/uploads/pulse-terrain-1783536609027-360135.jpg","images":["assets/uploads/pulse-terrain-1783536609027-360135.jpg","https://picsum.photos/seed/pulseter1/1920/1440","https://picsum.photos/seed/pulseter2/1920/1440","https://picsum.photos/seed/pulseter3/1920/1440"],"note":"An immersive projection in which abstract video based on terrain data covers the entire floor."},{"id":"RES09","t":"Resonant Grid","s":"2024","e":"2024","date":"2024.10","form":"object-screen","kind":"work","tags":["interactive","physical-computing","realtime","sensors","light"],"img":"assets/uploads/resonant-grid-1783536731047-388544.jpg","images":["assets/uploads/resonant-grid-1783536731047-388544.jpg","https://picsum.photos/seed/resonant1/1920/1440","https://picsum.photos/seed/resonant2/1920/1440","https://picsum.photos/seed/resonant3/1920/1440"],"note":"An interactive media installation for a brand launch event. Grid-shaped lighting and sensor input combine so the space responds to audience participation. Role Developed an Arduino-based sensor and lighting control system Programmed the DMX lighting sequence Handled on-site installation and interaction testing"},{"id":"SIL10","t":"Silent Circuit","s":"2024","e":"2024","date":"2024.04","form":"object-screen","kind":"work","tags":["interactive","physical-computing","realtime","sensors"],"img":"assets/uploads/silent-circuit-1783536645863-267776.jpg","images":["assets/uploads/silent-circuit-1783536645863-267776.jpg","https://picsum.photos/seed/silentci1/1920/1440","https://picsum.photos/seed/silentci2/1920/1440","https://picsum.photos/seed/silentci3/1920/1440"],"note":"An interactive installation visualizing the flow of electrical signals as a circuit of light."},{"id":"SLO11","t":"Slow Circuit","s":"2024","e":"2024","date":"2024.06","form":"object-screen","kind":"work","tags":["interactive","physical-computing","realtime","sensors"],"img":"assets/uploads/slow-circuit-1783535231223-875608.jpg","images":["assets/uploads/slow-circuit-1783535231223-875608.jpg","https://picsum.photos/seed/slowcirc1/1920/1440","https://picsum.photos/seed/slowcirc2/1920/1440","https://picsum.photos/seed/slowcirc3/1920/1440"],"note":"A projection installation visualizing the slow flow of time through the speed of a circuit."},{"id":"SOF12","t":"Soft Machine","s":"2024","e":"2024","date":"2024.03","form":"object-screen","kind":"work","tags":["physical-computing","realtime","sensors"],"img":"assets/uploads/soft-machine-1783535930416-588092.jpg","images":["assets/uploads/soft-machine-1783535930416-588092.jpg","https://picsum.photos/seed/softmach1/1920/1440","https://picsum.photos/seed/softmach2/1920/1440","https://picsum.photos/seed/softmach3/1920/1440"],"note":"An interactive exhibition exploring the boundary between machine and organism."},{"id":"SON13","t":"Sonic Veil","s":"2024","e":"2024","date":"2024.10","form":"screen","kind":"work","tags":["interactive","realtime"],"img":"assets/uploads/sonic-veil-1783536089311-914832.jpg","images":["assets/uploads/sonic-veil-1783536089311-914832.jpg","https://picsum.photos/seed/sonicvei1/1920/1440","https://picsum.photos/seed/sonicvei2/1920/1440","https://picsum.photos/seed/sonicvei3/1920/1440"],"note":"An installation combining spatial audio and projection. The experience was designed so that the density of sound and texture of light shift depending on the audience's position. Role Developed spatial audio patches in Max/MSP Integrated visuals in TouchDesigner Set up the installation and demonstration environment"},{"id":"ECH14","t":"The Piano Room","s":"2024","e":"2024","date":"2024.07","form":"space-object","kind":"work","tags":["interactive","physical-computing","realtime","projection","sensors"],"img":"assets/uploads/01.jpg","images":["assets/uploads/01.jpg","assets/uploads/02.jpg","assets/uploads/03.jpg"],"note":"An installation where light and sound resonate together. Responding to the audience's movement, a soundscape and pattern of light shift in real time. The work began as a reinterpretation of a room containing a familiar instrument: a piano. Sound emerges without anyone touching a key, and the moment a person simply approaches, the entire space begins to respond as though it were itself an instrument. The audience is no longer a performer but becomes a body that plays the space itself. The room contains twelve infrared proximity sensors and a six-channel spatial audio system. Each sensor collects data in real time through an Arduino-based microcontroller. The resulting distance and velocity data is transmitted via serial communication to Unreal Engine, which simultaneously drives the projection-mapped light patterns and the volume and panning of the multichannel sound. The most technically demanding part of the project was minimizing latency. Even a slight mismatch between the audience's movement and the light or sound response is enough to instantly break the sense that the space is truly responding to them. To address this, the sensor polling interval was tuned to under 20ms, and inside Unreal Engine the audio and visual pipelines were separated onto distinct threads so that the sound response would never stutter even if a frame was dropped. One of the most memorable moments during the exhibition period was watching how children engaged with the space. Adult visitors tended to approach cautiously, trying to understand the rules of the space, while children would immediately run through it, testing its responses with their whole bodies. This produced unexpected combinations of sound and overlapping light that gave the impression the work kept being rewritten even after its completion. In the spatial audio design, the goal went beyond simply reproducing the location of a sound — the length and density of the reverb were designed to change according to the audience's path through the room. Near the center of the room, sound spreads wider and lingers longer; closer to the walls, it becomes narrower and drier. This was built by referencing the acoustic characteristics of an actual room containing a piano and reconstructing them within a digital environment. The light patterns move between three broad states: in a static state, only a faint, breathing-like change in brightness exists; once a single visitor is detected, concentric waves ripple outward centered on that person; and when multiple visitors are detected simultaneously, their individual waves interfere with one another to create unpredictable patterns. This interference pattern is not a pre-made animation but is generated differently in real time at every moment. The question I returned to most while preparing this work was how to make the technology invisible. Sensors, projectors, and speakers physically exist throughout the space, but the instant a visitor becomes aware of these devices, the experience the work offers collapses into an explainable mechanism. For that reason, all hardware was concealed as much as possible within the walls and ceiling, and the wiring was embedded beneath the floor finish so it would disappear entirely from view. In the end, this piece is less a finished, singular result than a score that keeps being rewritten for as long as an audience remains in the space. The same room produces an entirely different combination of sound and light depending on who is moving, how many people, and at what speed — and I plan to extend this into variant installations in other spaces in the future.","vimeo":"https://vimeo.com/1208184865?fl=tl&fe=ec"},{"id":"LAY15","t":"Layered City","s":"2023","e":"2023","date":"2023.05","form":"screen","kind":"professional","tags":["interactive","realtime","projection"],"img":"assets/uploads/layered-city-1783536481692-955235.jpg","images":["assets/uploads/layered-city-1783536481692-955235.jpg","https://picsum.photos/seed/layeredc1/1920/1440","https://picsum.photos/seed/layeredc2/1920/1440","https://picsum.photos/seed/layeredc3/1920/1440"],"note":"An exhibition project exploring the temporal layers of a city through interactive mapping."},{"id":"FRA16","t":"Fractal Memory","s":"2022","e":"2022","date":"2022.04","form":"screen","kind":"professional","tags":["realtime"],"img":"assets/uploads/fractal-memory-1783536361480-700792.jpg","images":["assets/uploads/fractal-memory-1783536361480-700792.jpg","https://picsum.photos/seed/fractalm1/1920/1440","https://picsum.photos/seed/fractalm2/1920/1440","https://picsum.photos/seed/fractalm3/1920/1440"],"note":"A projection installation visualizing layers of memory through a fractal structure. As the audience moves, video layers branch and overlap to create new patterns. Role Designed projection mapping in TouchDesigner Configured output and blending in MadMapper Coordinated the installation space layout"},{"id":"GRA17","t":"Gravity Well","s":"2022","e":"2022","date":"2022.08","form":"space","kind":"professional","tags":["interactive","realtime"],"img":"assets/uploads/gravity-well-1783536704000-468627.jpg","images":["assets/uploads/gravity-well-1783536704000-468627.jpg","https://picsum.photos/seed/gravityw1/1920/1440","https://picsum.photos/seed/gravityw2/1920/1440","https://picsum.photos/seed/gravityw3/1920/1440"],"note":"An interactive installation project responding to the audience's movement. Gravity data is converted into visual and auditory elements to deepen the sense of immersion throughout the space. Role Built the interaction environment in Unreal Engine Integrated ZigSim sensor data Collaborated on physics simulation and sound design"},{"id":"PRI18","t":"Prism Field","s":"2021","e":"2021","date":"2021.01","form":"space","kind":"professional","tags":["interactive","realtime","light"],"img":"assets/uploads/prism-field-1783536531816-473773.jpg","images":["assets/uploads/prism-field-1783536531816-473773.jpg","https://picsum.photos/seed/prismfie1/1920/1440","https://picsum.photos/seed/prismfie2/1920/1440","https://picsum.photos/seed/prismfie3/1920/1440"],"note":"A large-scale projection media-wall project installed in a brand exhibition space. Spectral light crosses the space, and the visual rhythm shifts along the viewing path. Role Built the video pipeline in TouchDesigner Integrated DMX lighting and designed the sequence Handled on-site projection mapping and setup"},{"id":"DD19","t":"The Forest","s":"2021","e":"2021","date":"2021.09","form":"space-object","kind":"work","tags":["interactive","physical-computing","realtime","projection","sensors"],"img":"assets/uploads/dd-1783536105613-917651.jpg","images":["assets/uploads/dd-1783536105613-917651.jpg","assets/uploads/f01.jpg","assets/uploads/f02.jpg","assets/uploads/f03.jpg"],"note":"A live performance exploring the concept of afterimage through body and video."},{"id":"GHO20","t":"Ghost Frequency","s":"2020","e":"2020","date":"2020.01","form":"object-screen","kind":"professional","tags":["interactive","physical-computing","realtime","sensors"],"img":"assets/uploads/ghost-frequency-1783536430417-714178.jpg","images":["assets/uploads/ghost-frequency-1783536430417-714178.jpg","https://picsum.photos/seed/ghostfre1/1920/1440","https://picsum.photos/seed/ghostfre2/1920/1440","https://picsum.photos/seed/ghostfre3/1920/1440"],"note":"An interactive installation translating an invisible frequency band into light."},{"id":"COD21","t":"Code Landscape","s":"2018","e":"2018","date":"2018.04","form":"screen","kind":"work","tags":["interactive","realtime"],"img":"assets/uploads/code-landscape-1783536554583-83414.jpg","images":["assets/uploads/code-landscape-1783536554583-83414.jpg","https://picsum.photos/seed/codeland1/1920/1440","https://picsum.photos/seed/codeland2/1920/1440","https://picsum.photos/seed/codeland3/1920/1440"],"note":"An interactive video in which an algorithmically generated landscape shifts in response to audience input."},{"id":"MIR22","t":"Mirror Phase","s":"2018","e":"2018","date":"2018.06","form":"object-screen","kind":"professional","tags":["interactive","physical-computing","realtime","sensors"],"img":"assets/uploads/mirror-phase-1783536573739-652675.jpg","images":["assets/uploads/mirror-phase-1783536573739-652675.jpg","https://picsum.photos/seed/mirrorph1/1920/1440","https://picsum.photos/seed/mirrorph2/1920/1440","https://picsum.photos/seed/mirrorph3/1920/1440"],"note":"A performance where mirror and video overlap, reflecting the audience's movement in real time."},{"id":"VOI23","t":"Void Echo","s":"2018","e":"2018","date":"2018.07","form":"screen","kind":"work","tags":["interactive","realtime"],"img":"assets/uploads/void-echo-1783536544789-212566.jpg","images":["assets/uploads/void-echo-1783536544789-212566.jpg","https://picsum.photos/seed/voidecho1/1920/1440","https://picsum.photos/seed/voidecho2/1920/1440","https://picsum.photos/seed/voidecho3/1920/1440"],"note":"An echoing installation in which the audience's footsteps resounding through an empty space return as visual patterns."}],"labs":[{"id":"L01","t":"Sensor response mapping test","y":"2026","date":"2026.01","of":null,"form":"space-object","tags":["physical-computing","projection","sensors"],"img":"https://picsum.photos/seed/lab-sensor/600/750","images":["https://picsum.photos/seed/lab-sensor/600/750"],"note":"Ongoing lab study."},{"id":"L02","t":"Unreal lighting & shadow test","y":"2026","date":"2026.01","of":null,"form":"space","tags":["realtime","projection","light","shadow"],"img":"https://picsum.photos/seed/lab-unreal/600/750","images":["https://picsum.photos/seed/lab-unreal/600/750"],"note":"Ongoing lab study."},{"id":"L03","t":"Window interaction prototype","y":"2026","date":"2026.01","of":null,"form":"screen","tags":["interactive","display"],"img": BRAND_5","t":"n","kind":"brand"}],"about":{"name":"3Dowon","role":"Interactive Media Artist","origin":"Born 1996, South Korea","practice":"3Dowon is an interactive media artist who reimagines how people experience space by adding small changes to familiar objects. Starting from things easily encountered in everyday life — windows, books, sunlight, water, plants — he creates interactive environments that lead the audience to see familiar scenery anew through fresh senses. Working with interactive installation and physical computing, he connects digital media with physical space through real-time graphics and sensor technology. In that process, the boundary between reality and the virtual naturally blurs, and the experience lingers on as a memory.","approach":"In 3Dowon's work, technology is not something to be shown off but a material for experience. Sensors operate quietly behind the scenes, helping the audience immerse themselves in the space and the experience itself rather than the technology. He leads people to slow their steps for a moment, trust the experience in front of them, and let everyday actions become reality within the work. Recently, he has continued a practice of adding small changes to familiar objects and spaces, creating warm experiences that linger long in people's memory and senses.","fields":["Interactive installation","Physical computing","Real-time graphics","Sensor technology"],"image":"https://picsum.photos/seed/3dowon-about/1200/800","labels":{"practice":"Practice","approach":"Approach"}},"cv":{"sections":[{"title":"Education","entries":[{"year":"2017–2019","description":"Myongji College, Software Content"}]},{"title":"Experience","entries":[{"year":"2026.03–","description":"Nerdy Artist Union, Technical Artist"},{"year":"2024.01–","description":"3Dowon, Interactive Media Artist"},{"year":"2025.02–2026.01","description":"I M fine, Media Art Developer"},{"year":"2022.01–2023.12","description":"d'strict, Media Art Developer"}]},{"title":"Exhibitions","entries":[{"year":"2025.11","description":"Group Exhibition, \u003cem>3Dowon's workdesk\u003c/em>, Uprising Festa vol.1, SETEC, Seoul"},{"year":"2025.03","description":"Solo Exhibition, \u003cem>Postcode\u003c/em>, CICA Museum, Gimpo"}]},{"title":"Awards","entries":[{"year":"2021","description":"Grand Prize, Immersive Content Creator Training Program, KOCCA"},{"year":"2019","description":"Grand Prize, VR Content Competition, Ministry of Culture, Sports and Tourism / KOCCA"},{"year":"2018","description":"Grand Prize, Seongnam Connect Game Camp, Seongnam Industry Promotion Agency"},{"year":"2018","description":"Special Prize, Engineering Band Festival, Council for Innovation in Engineering Education"},{"year":"2018","description":"Grand Prize, MR/AR/VR Content Developer Project Evaluation, SBA / Myongji College"},{"year":"2017","description":"Grand Prize, VR Development Competition, Myongji College"},{"year":"2017","description":"Grand Prize, Virtual Reality Content Planning Competition, Myongji College"}]},{"title":"Training","entries":[{"year":"2021.05–2021.11","description":"Immersive Content Creator Training Program, Korea Creative Content Agency (KOCCA)"},{"year":"2019.02–2019.08","description":"3D Graphic Artist Course, Korea Radio Promotion Association (RAPA)"},{"year":"2018.06–2018.12","description":"Industry-Tailored MR/AR/VR Content Development Course, Korea Radio Promotion Association (RAPA)"},{"year":"2018.03–2018.09","description":"Virtual/Augmented Reality Content Developer Training, Seoul Business Agency (SBA)"}]}]},"copy":{"role":"Interactive installation","hint":"Hover a cell","back":"← Index","about":"About","home":"works.html"}}</script>
