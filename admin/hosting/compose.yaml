services:
  admin:
    build:
      context: ../..
      dockerfile: admin/hosting/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ADMIN_MODE: online
      ADMIN_ORIGIN: https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      PORT: 4848
    volumes:
      - repository:/data
      - settings:/home/node/.3dowon-admin
    # Only Caddy can reach this port; do not publish 4848 to the internet.
    expose: ["4848"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on: [admin]
volumes:
  repository:
  settings:
  certificates:
  caddy_config:
