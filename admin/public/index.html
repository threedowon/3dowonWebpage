<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>3Dowon — Admin</title>
<link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="admin-header">
    <h1>3Dowon Admin</h1>
    <p class="admin-note">로컬 전용 도구입니다. 저장하면 content/*.json과 HTML이 바로 수정돼요. 다 마쳤으면 아래 배포 버튼으로 실제 사이트에 올리세요.</p>
    <nav class="admin-tabs">
      <button class="admin-tab active" data-tab="works">Works</button>
      <button class="admin-tab" data-tab="about">About</button>
      <button class="admin-tab" data-tab="cv">CV</button>
      <button class="admin-tab" data-tab="lab">Lab</button>
      <button class="admin-tab" data-tab="site">Site</button>
    </nav>
    <div class="deploy-bar">
      <input type="text" id="deployMessage" placeholder="배포 메시지 (선택, 비우면 자동 생성)" />
      <button id="deployBtn" type="button">🚀 배포</button>
      <span id="deployStatus" class="deploy-status"></span>
    </div>
  </header>

  <main>
    <section id="tab-works" class="admin-panel active">
      <h2>새 작업 추가</h2>
      <form id="newWorkForm" class="admin-form">
        <div class="field-row">
          <label>슬러그 (영문/숫자/하이픈)<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="new-work" /></label>
        </div>
        <div class="field-row">
          <label>작업명 (한글)<input name="title" placeholder="한글 제목" /></label>
          <label>작업명 (영문)<input name="title_en" placeholder="English title" /></label>
        </div>
        <label>연도<input name="year" type="number" /></label>
        <label>유형<div class="chk-group" id="newWorkTypes"></div></label>
        <button type="submit">추가</button>
      </form>

      <h2>작업 목록</h2>
      <p class="admin-hint">↑ ↓ 버튼으로 Works 그리드·인덱스 표시 순서를 바꿀 수 있어요.</p>
      <div id="worksList" class="works-list"></div>
    </section>

    <section id="tab-about" class="admin-panel">
      <h2>About</h2>
      <form id="aboutForm" class="admin-form">
        <label>이름<input name="name" /></label>
        <label>이름 (EN)<input name="name_en" /></label>
        <label>메타 (줄바꿈으로 구분, 예: 역할 / 출생정보)<textarea name="meta" rows="2"></textarea></label>
        <label>메타 (EN)<textarea name="meta_en" rows="2"></textarea></label>
        <label>본문 (엔터로 줄바꿈, 빈 줄로 문단 구분)<textarea name="body" rows="8"></textarea></label>
        <label>본문 (EN) (엔터로 줄바꿈, 빈 줄로 문단 구분)<textarea name="body_en" rows="8"></textarea></label>
        <button type="submit">저장</button>
      </form>
      <div class="image-box">
        <img id="aboutImagePreview" alt="about" />
        <input type="file" id="aboutImageInput" accept="image/*" />
      </div>
    </section>

    <section id="tab-cv" class="admin-panel">
      <h2>CV</h2>
      <div id="cvSections"></div>
      <button id="addCvSection" type="button">섹션 추가</button>
      <button id="saveCv" type="button">저장</button>
    </section>

    <section id="tab-lab" class="admin-panel">
      <h2>Lab</h2>
      <form id="newLabForm" class="admin-form">
        <label>캡션<input name="caption" required /></label>
        <label>캡션 (EN)<input name="caption_en" /></label>
        <label>썸네일 이미지 (필수)<input type="file" name="image" accept="image/*" required /></label>
        <label>영상 (선택, 클릭 시 재생)<input type="file" name="video" accept="video/*" /></label>
        <button type="submit">추가</button>
      </form>
      <div id="labList" class="lab-list"></div>
    </section>

    <section id="tab-site" class="admin-panel">
      <h2>연락처 / SNS</h2>
      <form id="siteForm" class="admin-form">
        <label>이메일<input name="email" /></label>
        <label>Instagram URL<input name="instagram" /></label>
        <label>Vimeo URL<input name="vimeo" /></label>
        <label>YouTube URL<input name="youtube" /></label>
        <button type="submit">저장</button>
      </form>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
